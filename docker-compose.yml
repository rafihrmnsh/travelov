name: travelov

services:
  db:
    image: postgres:16-alpine
    container_name: travelov-db
    environment:
      POSTGRES_DB: travelov
      POSTGRES_USER: travelov
      POSTGRES_PASSWORD: travelov
    volumes:
      - travelov-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelov -d travelov"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: travelov-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelov-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=travelov;Username=travelov;Password=travelov"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: "docker-compose-travelov-signing-key-change-me-0123456789"
      SandboxPayment__Secret: "docker-compose-sandbox-secret-change-me"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelov-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  travelov-db-data:
